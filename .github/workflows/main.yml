name: Build Kernel with KernelSU

on:
  schedule:
    - cron: '0 0 */3 * *'

  workflow_dispatch:
    inputs:
      susfs_branch:
        description: 'KernelSU branch/tag to checkout (e.g. susfs-main, susfs-test)'
        required: false
        default: 'susfs-main'
      ksu_source:
        description: 'Choose KernelSU source'
        required: false
        default: 'sukisu'
        type: choice
        options:
          - sukisu
          - rsuntk

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up build environment
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            bc \
            kmod \
            cpio \
            flex \
            bison \
            libssl-dev \
            libelf-dev \
            libncurses5-dev \
            libncurses-dev \
            dwarves \
            zstd \
            python3 \
            rsync \
            wget \
            git

      # 添加工具链缓存
      - name: Cache toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ~/toolchain
          key: toolchain-v2-${{ runner.os }}-clang-22.0.0git-20250920-${{ hashFiles('**/build.sh') }}
          restore-keys: |
            toolchain-v2-${{ runner.os }}-clang-22.0.0git-20250920-
            toolchain-v2-${{ runner.os }}-

      - name: Configure KernelSU for rsuntk source
        if: github.event.inputs.ksu_source == 'rsuntk'
        run: |
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/cannon_defconfig
          sed -i 's/CONFIG_KSU_TRACEPOINT_HOOK=y/CONFIG_KSU_TRACEPOINT_HOOK=n/g' arch/arm64/configs/cannon_defconfig

      - name: Inject KernelSU using setup.sh
        run: |
          BRANCH="${{ github.event.inputs.susfs_branch || 'susfs-main' }}"
          KSU_SOURCE="${{ github.event.inputs.ksu_source || 'sukisu' }}"
          
          if [ "$KSU_SOURCE" = "rsuntk" ]; then
            curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s "$BRANCH"
          else
            curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$BRANCH"
          fi

      - name: Run build.sh
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-image
          path: |
            out/arch/arm64/boot/Image
            out/arch/arm64/boot/Image.gz-dtb
          if-no-files-found: error